<!DOCTYPE html>
<html lang="en">
<head>
    <title>WAYSTONES</title>
</head>
<script>

    //some kind of global list of hexes
    let theSolvedGrid = [];
    let theActiveGrid = [];
    let theNexusCoords = [];
    let theHexElements = [];
    let theWidth = 6;
    let theHeight = 6;
    let theNumColors = 3;
    let theSelectedHexIdx = undefined;
    let nexusColorValues = [
        "#FF0000",
        "#00FF00",
        "#0000FF",
        "#FFFF00",
        "#FF00FF",
        "#00FFFF"];

    let hexColorValues = [
        "#AA0000",
        "#00AA00",
        "#0000AA",
        "#AAAA00",
        "#AA00AA",
        "#00AAAA"];

    function hexIndexToXY(hexIdx)
    {
        return {x:hexIdx % theWidth, y:Math.floor(hexIdx / theWidth)};
    }

    function hexIndexToDoubledXY(hexIdx)
    {
        let baseX = hexIdx % theWidth;
        let baseY = Math.floor(hexIdx / theWidth);

        if((baseY % 2) === 0)
        {
            return {x:baseX * 2, y:baseY};
        }
        else
        {
            return {x:(baseX * 2)+1, y:baseY};
        }
    }

    function xyToHexIndex(x, y)
    {
        return (y * theWidth) + x;
    }

    function calcDistDoubled(coordA, coordB)
    {
        let dX = Math.abs(coordA.x - coordB.x);
        let dY = Math.abs(coordA.y - coordB.y);
        return dY + Math.max(0, (dX - dY)/2);
    }

    function updateHexElement(hexIdx)
    {
        let hexElement = theHexElements[hexIdx];
        let hexData = theActiveGrid[hexIdx];

        let nexusIdx = theNexusCoords[hexData.hexColorIdx];

        let hexCoord = hexIndexToDoubledXY(hexIdx);
        let nexusCoord = hexIndexToDoubledXY(nexusIdx);

        let distanceFromNexus = calcDistDoubled(hexCoord, nexusCoord);

        let correctPos = distanceFromNexus === hexData.hexNum;

        if(hexIdx === nexusIdx){
            hexElement.style.background = nexusColorValues[hexData.hexColorIdx];
            hexElement.style.borderColor = "#EEEEEE";
            hexElement.firstChild.style.transform = "scale(1.5)";
            hexElement.firstChild.innerHTML = "X";
        }
        else{
            hexElement.firstChild.innerHTML = hexData.hexNum;
            if(correctPos){
                hexElement.style.background = nexusColorValues[hexData.hexColorIdx];
                hexElement.style.borderColor = "#EEEEEE";
            }
            else {
                hexElement.style.background = hexColorValues[hexData.hexColorIdx];
                hexElement.style.borderColor = "#666666";
            }
        }
    }

    function checkForSolve() {
        //TODO
    }


    function onHexClicked(hexIdx)
    {
        let isNexus = theNexusCoords.indexOf(hexIdx) !== -1;

        if(!isNexus)
        {
            if(theSelectedHexIdx === undefined){
                theSelectedHexIdx = hexIdx;
                theHexElements[theSelectedHexIdx].style.transform="scale(1.1)";
            }
            else{
                if(theSelectedHexIdx !== hexIdx)
                {
                    let tempHex = theActiveGrid[hexIdx];
                    theActiveGrid[hexIdx] = theActiveGrid[theSelectedHexIdx];
                    theActiveGrid[theSelectedHexIdx] = tempHex;

                    updateHexElement(hexIdx);
                    updateHexElement(theSelectedHexIdx);
                }

                theHexElements[theSelectedHexIdx].style.transform="";
                theSelectedHexIdx = undefined;
            }
        }
    }

    function findUnusedIndexIndexAtDistance(originIdx, unusedIndexes, targetDistance){
        let potentialIdxIdxs = [];

        let nexusCoord = hexIndexToDoubledXY(originIdx, theWidth);

        for(let idxIdx = 0; idxIdx < unusedIndexes.length; ++idxIdx){
            let unusedIdx = unusedIndexes[idxIdx];
            let unusedCoord = hexIndexToDoubledXY(unusedIdx, theWidth);

            let dist = calcDistDoubled(unusedCoord, nexusCoord, theWidth);

            if(dist === targetDistance)
            {
                potentialIdxIdxs.push(idxIdx);
            }
        }

        if(potentialIdxIdxs.length === 0) {
            return undefined;
        }
        else {
            let randomlyChosenIdxIdxIdx = Math.floor(Math.random() * potentialIdxIdxs.length);
            return potentialIdxIdxs[randomlyChosenIdxIdxIdx];
        }
    }

    function makeNewSolution(){
        theSolvedGrid = [];
        theNexusCoords = [];

        let unusedIndexes = [];

        for(let y = 0; y < theHeight; ++y)
        {
            for(let x = 0; x < theWidth; ++x)
            {
                unusedIndexes.push((y * theWidth) + x);
            }
        }

        //Set nexus positions
        for(let nexusIdx = 0; nexusIdx < theNumColors; ++nexusIdx){
            let chosenIdxIdx = Math.floor(Math.random() * unusedIndexes.length);
            let chosenIdx = unusedIndexes[chosenIdxIdx];
            unusedIndexes.splice(chosenIdxIdx, 1);
            theNexusCoords.push(chosenIdx);
            theSolvedGrid[chosenIdx] = {hexColorIdx: nexusIdx, hexNum: 0};
        }

        let colorDistances = [];

        for(let colorIdx = 0; colorIdx < theNumColors; ++colorIdx) {
            colorDistances[colorIdx] = 1;
        }

        let colorIdx = 0;
        let maxDistance = Math.floor(Math.sqrt(theWidth * theWidth + theHeight * theHeight));

        while(unusedIndexes.length > 0)
        {
            let findDistance = colorDistances[colorIdx];

            let found = false;

            while(!found){
                let nextHexIdxIdxForColor = findUnusedIndexIndexAtDistance(
                    theNexusCoords[colorIdx],
                    unusedIndexes,
                    findDistance,
                    theWidth
                )

                if(nextHexIdxIdxForColor !== undefined)
                {
                    let chosenIdx = unusedIndexes[nextHexIdxIdxForColor];
                    unusedIndexes.splice(nextHexIdxIdxForColor, 1);
                    theSolvedGrid[chosenIdx] = {hexColorIdx: colorIdx, hexNum: findDistance};
                    found = true;
                }
                else
                {
                    findDistance++;

                    if(findDistance > maxDistance)
                    {
                        findDistance = 1;
                    }
                }
            }

            colorIdx++;
            if(colorIdx >= theNumColors)
            {
                colorIdx = 0;
            }
        }
    }

    function initActiveGrid(){
        theActiveGrid = [];

        let unusedIdxs = [];
        let numHexes = theWidth * theHeight;

        for(let idxIdx = 0; idxIdx < numHexes; ++idxIdx) {
            if (theNexusCoords.find(function (element) {
                return idxIdx === element
            }) === undefined) {
                unusedIdxs.push(idxIdx);
            }
        }

        for(let idxIdx = 0; idxIdx < numHexes; ++idxIdx) {
            if (theNexusCoords.find(function (element) {
                return idxIdx === element
            }) === undefined) {
                let chosenIdxIdx = Math.floor(Math.random() * unusedIdxs.length);
                let chosenIdx = unusedIdxs[chosenIdxIdx];
                unusedIdxs.splice(chosenIdxIdx, 1);
                theActiveGrid[chosenIdx] = theSolvedGrid[idxIdx];
            }
            else{
                theActiveGrid[idxIdx] = theSolvedGrid[idxIdx];
            }
        }
    }

    function makeGrid()
    {
        makeNewSolution();
        initActiveGrid();

        //Wipe existing grid
        const hexGrid = document.getElementById('thehexgrid');

        theHexElements = [];
        while (hexGrid.firstChild) {
            hexGrid.removeChild(hexGrid.lastChild);
        }

        let xGap = 100 / (theWidth + 0.5);
        let yGap = (100 / theHeight) * Math.cos(Math.PI * 30 / 180);

        for (let y = 0; y < theHeight; ++y) {
            let xFudge = (y % 2 === 1) ? xGap * 0.5 : 0.0;
            for(let x = 0; x < theWidth; ++x) {
                let xPos = xFudge + (xGap * x);
                let yPos = yGap * y;

                let hexIdx = xyToHexIndex(x, y);
                let hexData = theActiveGrid[hexIdx];

                const hex = document.createElement("div");
                hex.className = "hex";
                hex.style.position = "absolute";
                hex.style.left = xPos + '%';
                hex.style.top = yPos + '%';
                hex.style.width = xGap + '%';
                hex.onclick = function(){onHexClicked(hexIdx)};

                const text = document.createElement("span");
                text.className = "num";

                hex.appendChild(text);
                hexGrid.appendChild(hex);
                theHexElements[hexIdx] = hex;
                updateHexElement(hexIdx);
            }
        }
    }

    function solveGrid() {

    }

    window.onload = function(){makeGrid();};
</script>

        width: auto;

<body>

</html>
