<!DOCTYPE html>
<html lang="en">
<head>
    <title>WAYSTONES</title>
</head>
<script>

    //some kind of global list of hexes
    let theSolvedGrid = [];
    let theActiveGrid = [];
    let theNexusCoords = [];
    let theHexElements = [];
    let theWidth = 6;
    let theHeight = 6;
    let theNumColors = 2;
    let theFillMode = 1;
    let theSolvedState = false;
    let theSelectedHexIdx = undefined;
    let brightColorValues = [
        "#DD2222",
        "#22DD22",
        "#2222DD",
        "#DDDD22",
        "#DD22DD",
        "#22DDDD"];

    let dullColorValues = [
        "#8D1616",
        "#168D16",
        "#16168D",
        "#8D8D16",
        "#8D168D",
        "#168D8D"];

    function hexIndexToXY(hexIdx)
    {
        return {x:hexIdx % theWidth, y:Math.floor(hexIdx / theWidth)};
    }

    function hexIndexToDoubledXY(hexIdx)
    {
        let baseX = hexIdx % theWidth;
        let baseY = Math.floor(hexIdx / theWidth);

        if((baseY % 2) === 0)
        {
            return {x:baseX * 2, y:baseY};
        }
        else
        {
            return {x:(baseX * 2)+1, y:baseY};
        }
    }

    function xyToHexIndex(x, y)
    {
        return (y * theWidth) + x;
    }

    function calcDistDoubled(coordA, coordB)
    {
        let dX = Math.abs(coordA.x - coordB.x);
        let dY = Math.abs(coordA.y - coordB.y);
        return dY + Math.max(0, (dX - dY)/2);
    }

    function updateHexElement(hexIdx)
    {
        let hexElement = theHexElements[hexIdx];
        let hexData = theActiveGrid[hexIdx];

        let nexusIdx = theNexusCoords[hexData.hexColorIdx];

        let correctPos = true;

        if(nexusIdx !== hexIdx){
            let hexCoord = hexIndexToDoubledXY(hexIdx);
            let nexusCoord = hexIndexToDoubledXY(nexusIdx);

            let distanceFromNexus = calcDistDoubled(hexCoord, nexusCoord);
            correctPos = distanceFromNexus === hexData.hexNum;
        }

        if(hexIdx === nexusIdx || correctPos){
            hexElement.style.borderColor = "#EEEEEE";
        }
        else{
            hexElement.style.borderColor = "#666666";
        }

        if(hexIdx === nexusIdx){
            hexElement.style.background = brightColorValues[hexData.hexColorIdx];
            hexElement.firstChild.style.transform = "scale(1.5)";
            hexElement.firstChild.innerHTML = "X";
        }
        else{
            hexElement.firstChild.innerHTML = hexData.hexNum;
            if(correctPos){
                hexElement.style.background = brightColorValues[hexData.hexColorIdx];
            }
            else {
                hexElement.style.background = dullColorValues[hexData.hexColorIdx];
            }
        }
    }

    function checkForSolve() {
        if(theSolvedState){
            return;
        }

        let numHexes = theWidth * theHeight;

        let solved = true;

        for(let hexIdx = 0; hexIdx < numHexes; ++hexIdx){
            let hexData = theActiveGrid[hexIdx];

            let nexusIdx = theNexusCoords[hexData.hexColorIdx];

            if(hexIdx === nexusIdx){
                continue;
            }

            let hexCoord = hexIndexToDoubledXY(hexIdx);
            let nexusCoord = hexIndexToDoubledXY(nexusIdx);

            let distanceFromNexus = calcDistDoubled(hexCoord, nexusCoord);

            let correctPos = distanceFromNexus === hexData.hexNum;

            if(!correctPos) {
                solved = false;
                break;
            }
        }

        if(solved) {
            theSolvedState = true;
            for(let hexIdx = 0; hexIdx < numHexes; ++hexIdx){
                updateHexElement(hexIdx);
            }
            document.getElementById("winPopup").classList.remove("hiddenPopup");
        }
    }


    function onHexClicked(hexIdx)
    {
        if(theSolvedState){
            return;
        }

        let isNexus = theNexusCoords.indexOf(hexIdx) !== -1;

        if(!isNexus)
        {
            if(theSelectedHexIdx === undefined){
                theSelectedHexIdx = hexIdx;
                theHexElements[theSelectedHexIdx].style.transform="scale(1.1)";
            }
            else{
                if(theSelectedHexIdx !== hexIdx)
                {
                    let tempHex = theActiveGrid[hexIdx];
                    theActiveGrid[hexIdx] = theActiveGrid[theSelectedHexIdx];
                    theActiveGrid[theSelectedHexIdx] = tempHex;

                    updateHexElement(hexIdx);
                    updateHexElement(theSelectedHexIdx);

                    checkForSolve();
                }

                theHexElements[theSelectedHexIdx].style.transform="";
                theSelectedHexIdx = undefined;
            }
        }
    }

    function findUnusedIndexIndexAtDistance(originIdx, unusedIndexes, targetDistance){
        let potentialIdxIdxs = [];

        let nexusCoord = hexIndexToDoubledXY(originIdx, theWidth);

        for(let idxIdx = 0; idxIdx < unusedIndexes.length; ++idxIdx){
            let unusedIdx = unusedIndexes[idxIdx];
            let unusedCoord = hexIndexToDoubledXY(unusedIdx, theWidth);

            let dist = calcDistDoubled(unusedCoord, nexusCoord, theWidth);

            if(dist === targetDistance)
            {
                potentialIdxIdxs.push(idxIdx);
            }
        }

        if(potentialIdxIdxs.length === 0) {
            return undefined;
        }
        else {
            let randomlyChosenIdxIdxIdx = Math.floor(Math.random() * potentialIdxIdxs.length);
            return potentialIdxIdxs[randomlyChosenIdxIdxIdx];
        }
    }

    function makeNewSolution(){
        theSolvedGrid = [];
        theNexusCoords = [];

        let unusedIndexes = [];

        let numHexes = theWidth * theHeight;

        for(let hexIdx = 0; hexIdx < numHexes; ++hexIdx)
        {
            unusedIndexes.push(hexIdx);
        }

        //Set nexus positions
        for(let nexusIdx = 0; nexusIdx < theNumColors; ++nexusIdx){
            let chosenIdxIdx = Math.floor(Math.random() * unusedIndexes.length);
            let chosenIdx = unusedIndexes[chosenIdxIdx];
            unusedIndexes.splice(chosenIdxIdx, 1);
            theNexusCoords.push(chosenIdx);
            theSolvedGrid[chosenIdx] = {hexColorIdx: nexusIdx, hexNum: 0};
        }

        if(theFillMode == 1){
            //Smaller numbers: Color 0 places 1, Color 1 places 1, so on
            let colorDistances = [];

            for(let colorIdx = 0; colorIdx < theNumColors; ++colorIdx) {
                colorDistances[colorIdx] = 1;
            }

            let colorIdx = 0;
            let maxDistance = Math.floor(Math.sqrt(theWidth * theWidth + theHeight * theHeight));

            while(unusedIndexes.length > 0)
            {
                let findDistance = colorDistances[colorIdx];

                let found = false;

                while(!found){
                    let nextHexIdxIdxForColor = findUnusedIndexIndexAtDistance(
                        theNexusCoords[colorIdx],
                        unusedIndexes,
                        findDistance,
                        theWidth
                    )

                    if(nextHexIdxIdxForColor !== undefined)
                    {
                        let chosenIdx = unusedIndexes[nextHexIdxIdxForColor];
                        unusedIndexes.splice(nextHexIdxIdxForColor, 1);
                        theSolvedGrid[chosenIdx] = {hexColorIdx: colorIdx, hexNum: findDistance};
                        found = true;
                    }
                    else
                    {
                        findDistance++;

                        if(findDistance > maxDistance)
                        {
                            findDistance = 1;
                        }
                    }
                }

                colorIdx++;
                if(colorIdx >= theNumColors)
                {
                    colorIdx = 0;
                }
            }
        }
        else
        {
            //Bigger numbers: Color 0 places 1,2,3,4,5,... Color 2 places 1,2,3,4,5,...
            let colorIdx = 0;
            let maxDistance = Math.floor(Math.sqrt(theWidth * theWidth + theHeight * theHeight));

            while (unusedIndexes.length > 0) {
                for (let findDistance = 1; findDistance <= maxDistance && unusedIndexes.length > 0; ++findDistance) {
                    let nextHexIdxIdxForColor = findUnusedIndexIndexAtDistance(
                        theNexusCoords[colorIdx],
                        unusedIndexes,
                        findDistance,
                        theWidth
                    );

                    if (nextHexIdxIdxForColor !== undefined) {
                        let chosenIdx = unusedIndexes[nextHexIdxIdxForColor];
                        unusedIndexes.splice(nextHexIdxIdxForColor, 1);
                        theSolvedGrid[chosenIdx] = {hexColorIdx: colorIdx, hexNum: findDistance};
                    }
                }

                colorIdx++;
                if (colorIdx >= theNumColors) {
                    colorIdx = 0;
                }
            }
        }
    }

    function initActiveGrid(){
        theActiveGrid = [];

        let unusedIdxs = [];
        let numHexes = theWidth * theHeight;

        for(let idxIdx = 0; idxIdx < numHexes; ++idxIdx) {
            if (theNexusCoords.find(function (element) {
                return idxIdx === element
            }) === undefined) {
                unusedIdxs.push(idxIdx);
            }
        }

        for(let idxIdx = 0; idxIdx < numHexes; ++idxIdx) {
            if (theNexusCoords.find(function (element) {
                return idxIdx === element
            }) === undefined) {
                let chosenIdxIdx = Math.floor(Math.random() * unusedIdxs.length);
                let chosenIdx = unusedIdxs[chosenIdxIdx];
                unusedIdxs.splice(chosenIdxIdx, 1);
                theActiveGrid[chosenIdx] = theSolvedGrid[idxIdx];
            }
            else{
                theActiveGrid[idxIdx] = theSolvedGrid[idxIdx];
            }
        }
    }

    function restartGame()
    {
        if(theSolvedState){
            document.getElementById("winPopup").classList.add("hiddenPopup");
        }
        theSolvedState = false;
        theWidth = Number(document.getElementById("widthSelector").value);
        theHeight = Number(document.getElementById("heightSelector").value);
        theNumColors = Number(document.getElementById("numColorsSelector").value);
        theFillMode = Number(document.getElementById("fillModeSelector").value);
        makeNewSolution();
        initActiveGrid();

        //Wipe existing grid
        const hexGrid = document.getElementById('thehexgrid');

        theHexElements = [];
        while (hexGrid.firstChild) {
            hexGrid.removeChild(hexGrid.lastChild);
        }

        let xGap = 100 / (theWidth + 0.5);
        let yGap = (100 / theHeight) * Math.cos(Math.PI * 30 / 180);

        for (let y = 0; y < theHeight; ++y) {
            let xFudge = (y % 2 === 1) ? xGap * 0.5 : 0.0;
            for(let x = 0; x < theWidth; ++x) {
                let xPos = xFudge + (xGap * x);
                let yPos = yGap * y;

                let hexIdx = xyToHexIndex(x, y);
                let hexData = theActiveGrid[hexIdx];

                const hex = document.createElement("div");
                hex.className = "hex";
                hex.style.position = "absolute";
                hex.style.left = xPos + '%';
                hex.style.top = yPos + '%';
                hex.style.width = xGap + '%';
                hex.onclick = function(){onHexClicked(hexIdx)};

                const text = document.createElement("span");
                text.className = "num";

                hex.appendChild(text);
                hexGrid.appendChild(hex);
                theHexElements[hexIdx] = hex;
                updateHexElement(hexIdx);
            }
        }
    }

    function solveGrid() {
        let numHexes = theWidth * theHeight;
        for(let hexIdx = 0; hexIdx < numHexes; ++hexIdx) {
            theActiveGrid[hexIdx] = theSolvedGrid[hexIdx];
        }
        for(let hexIdx = 0; hexIdx < numHexes; ++hexIdx) {
            updateHexElement(hexIdx);
        }
        checkForSolve();
    }

    window.onload = function(){restartGame();};
</script>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        color: #EEEEEE;
        background-color: #333333;
    }
    h1 {
        margin: auto;
        text-align: center;
        align-content: center;
    }
    h2 {
        margin: auto;
        text-align: center;
        align-content: center;
    }
    .hexgrid
    {
        position: relative;
        width: 50%;
        aspect-ratio: 1.0;
        margin:auto;
    }
    .hex
    {
        display: flex;
        aspect-ratio: cos(30deg);
        border-radius: 50% / 25%;
        corner-shape: bevel;
        border-style: solid;
        border-color:#EEEEEE;
        border-width:3px;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
        font-size: large;
        justify-content: center;
        align-items: center;
        background-color:#444444;
    }
    .buttonbar
    {
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .buttonbar > .button
    {
        width: auto;
        border-style: solid;
        border-color: #EEEEEE;
        border-width: 2px;
        background-color:#444444;
        color: #EEEEEE;
    }
    .popupContainer
    {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top:0;
        left:0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
    }
    .winPopup
    {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        background-color: #000000;
        opacity: 75%;
        font-size: xxx-large;
    }
    .hiddenPopup
    {
        visibility: hidden;
    }

</style>
<body>
<h1>WAYSTONES</h1>
<h2>by Lewis Wakeford</h2>
<div id = "thehexgrid" class = "hexgrid">
</div>
<div class = "settingsbar">
    <label for="widthSelector">Width:</label>
    <select id="widthSelector">
        <option value="6" selected="selected">6</option>
        <option value="8">8</option>
        <option value="10">10</option>
        <option value="12">12</option>
    </select>
    <label for="heightSelector">Width:</label>
    <select id="heightSelector">
        <option value="6" selected="selected">6</option>
        <option value="8">8</option>
        <option value="10">10</option>
        <option value="12">12</option>
    </select>
    <label for="numColorsSelector">Num Colors:</label>
    <select id="numColorsSelector">
        <option value="2">2</option>
        <option value="3" selected="selected">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
    </select>
    <label for="fillModeSelector">Fill Mode:</label>
    <select id ="fillModeSelector">
        <option value="1">More Low Numbers</option>
        <option value="2" selected="selected">More High Numbers</option>
    </select>
</div>
<div class = "buttonbar">
    <button class = "button" id = "button_startover" onclick="restartGame()">Start Over</button>
    <button class = "button" id = "button_showsolution" onclick="solveGrid()">Show Solution</button>
</div>
<div class="popupContainer">
    <div id = "winPopup" class = "winPopup hiddenPopup">SOLVED</div>
</div>
</body>
</html>
